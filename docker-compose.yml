services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Must be the externally visible URL, or adapter-node rejects every POST.
      ORIGIN: ${ORIGIN:?set ORIGIN in .env}
      # adapter-node defaults to 512K, which rejects every real video.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-1073741824}
    volumes:
      # The whole point: the database and the videos outlive any image rebuild.
      - /srv/data/lindyhop/data:/data
    # Hits an endpoint that actually queries the database, so a container that
    # booted but cannot open /data reports unhealthy instead of quietly accepting
    # requests. No curl in the slim image; node's fetch does the job.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # docker compose --profile dev up
  dev:
    profiles: [dev]
    # Must match the Dockerfile: node:sqlite needs >= 23.4 without a flag.
    image: node:24-bookworm-slim
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @lindyhop/web dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      # Keeps the container's own node_modules — argon2 resolves a prebuilt
      # binary per platform, and the host's would be the wrong one.
      - dev-node-modules:/repo/node_modules

volumes:
  dev-node-modules:
